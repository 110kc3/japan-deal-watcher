name: Update Deal Watcher Dashboard

on:
  schedule:
    # Run every hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/watchlist.json'
      - 'data/yahoo_deals.json'
      - 'watcher/**'
      - 'main.py'
      - '.github/workflows/**'

concurrency:
  group: deal-watcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Deal Watcher
        run: |
          python main.py

      - name: Run Verification Checks Audit
        run: |
          python check_deals.py --strict

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md YAHOO_AUCTIONS_DEALS.md AUCTION_SNIPING_GUIDE.md data/current_deals.json
          git diff --staged --quiet || (
            git commit -m "chore(deals): update live deals dashboard & 60-day storage countdown [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          )
