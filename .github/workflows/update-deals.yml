name: Update Deal Watcher Dashboard

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/watchlist.json'
      - 'watcher/**'

concurrency:
  group: deal-watcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Deal Watcher
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md data/current_deals.json
          git diff --staged --quiet || (
            git commit -m "chore(deals): update live deals dashboard & 60-day storage countdown [skip ci]"
            git pull --rebase origin main
            git push origin main
          )
