name: Update Deal Watcher Dashboard

on:
  schedule:
    # Run every hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/watchlist.json'
      - 'data/yahoo_deals.json'
      - 'watcher/**'
      - 'main.py'
      - '.github/workflows/**'

concurrency:
  group: deal-watcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Deal Watcher
        run: |
          python main.py

      - name: Run Verification Checks Audit
        run: |
          python check_deals.py --strict

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md YAHOO_AUCTIONS_DEALS.md AUCTION_SNIPING_GUIDE.md AUCTION_RADAR.md MARKET_SALES_HISTORY.md data/current_deals.json data/price_history.json docs/
          git diff --staged --quiet || (
            git commit -m "chore(deals): update live deals, auction radar & webapp data feed [skip ci]"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          )

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy-pages:
    needs: update-dashboard
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
