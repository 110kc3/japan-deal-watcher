  <!-- Labels -->
  <text x="200.0" y="213.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">New Nintendo 3DS XL</text>
  <text x="200.0" y="239.20000000000002" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">Super-Stable 3D · C-Stick · IPS Dual Screen</text>
