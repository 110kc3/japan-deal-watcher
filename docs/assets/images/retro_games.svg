<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="260" rx="16" fill="url(#bg)" />
  <rect width="400" height="260" rx="16" fill="url(#glow)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Icon Graphics Group -->
  <g filter="url(#shadow)" transform="translate(200.0, 109.2)">
    
  <!-- Stack of Game Cartridges & Cases -->
  <!-- Cartridge 1 -->
  <rect x="-70" y="-40" width="80" height="65" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="2" transform="rotate(-12)" />
  <rect x="-62" y="-32" width="64" height="38" rx="2" fill="#ef4444" opacity="0.8" transform="rotate(-12)" />
  <!-- Cartridge 2 -->
  <rect x="-20" y="-50" width="85" height="70" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2" transform="rotate(8)" />
  <rect x="-12" y="-42" width="68" height="42" rx="2" fill="#3b82f6" opacity="0.8" transform="rotate(8)" />
  <!-- UMD Disc Case front -->
  <rect x="-35" y="-15" width="80" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <circle cx="5" cy="22" r="24" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="5" y="27" font-size="14" font-weight="900" fill="#10b981" text-anchor="middle">UMD</text>

  </g>
  
  <!-- Labels -->
  <text x="200.0" y="213.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">Hurtowy Pakiet Gier Retro</text>
  <text x="200.0" y="239.20000000000002" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">DS · GBA · PS1 · PS2 · UMD · 0% Li-Ion</text>
</svg>