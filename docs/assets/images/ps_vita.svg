<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="260" rx="16" fill="url(#bg)" />
  <rect width="400" height="260" rx="16" fill="url(#glow)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Icon Graphics Group -->
  <g filter="url(#shadow)" transform="translate(200.0, 109.2)">
    
  <!-- PS Vita Body -->
  <rect x="-110" y="-55" width="220" height="110" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <!-- OLED Screen -->
  <rect x="-65" y="-42" width="130" height="84" rx="6" fill="#090d16" stroke="#0ea5e9" stroke-width="1.5" />
  <rect x="-60" y="-38" width="120" height="76" rx="4" fill="#0284c7" opacity="0.15" />
  <!-- Left Stick & D-pad -->
  <circle cx="-88" cy="18" r="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <rect x="-92" y="-28" width="8" height="24" rx="2" fill="#64748b" />
  <rect x="-100" y="-20" width="24" height="8" rx="2" fill="#64748b" />
  <!-- Right Stick & Face Buttons -->
  <circle cx="88" cy="18" r="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <circle cx="88" cy="-28" r="4.5" fill="#38bdf8" />
  <circle cx="76" cy="-16" r="4.5" fill="#f43f5e" />
  <circle cx="100" cy="-16" r="4.5" fill="#10b981" />
  <circle cx="88" cy="-4" r="4.5" fill="#eab308" />
  <!-- PS Logo Glow -->
  <circle cx="-45" cy="48" r="4" fill="#0ea5e9" />

  </g>
  
  <!-- Labels -->
  <text x="200.0" y="213.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">PlayStation Vita</text>
  <text x="200.0" y="239.20000000000002" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">PCH-1000 OLED & PCH-2000 Slim</text>
</svg>