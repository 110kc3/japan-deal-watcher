<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="260" rx="16" fill="url(#bg)" />
  <rect width="400" height="260" rx="16" fill="url(#glow)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Icon Graphics Group -->
  <g filter="url(#shadow)" transform="translate(200.0, 109.2)">
    
  <!-- Top Flip Cover -->
  <rect x="-65" y="-75" width="130" height="62" rx="8" fill="#3b82f6" stroke="#93c5fd" stroke-width="2.5" />
  <rect x="-42" y="-67" width="84" height="48" rx="4" fill="#0284c7" opacity="0.4" stroke="#67e8f9" stroke-width="1.5" />
  <!-- Hinge -->
  <rect x="-55" y="-12" width="110" height="8" rx="4" fill="#1e3a8a" />
  <!-- Bottom Base -->
  <rect x="-65" y="-3" width="130" height="65" rx="8" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2.5" />
  <!-- D-pad -->
  <rect x="-44" y="16" width="5" height="18" rx="1" fill="#0f172a" />
  <rect x="-51" y="22" width="18" height="5" rx="1" fill="#0f172a" />
  <!-- A B Buttons -->
  <circle cx="45" cy="20" r="5" fill="#0f172a" />
  <circle cx="32" cy="30" r="5" fill="#0f172a" />

  </g>
  
  <!-- Labels -->
  <text x="200.0" y="213.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">Game Boy Advance SP</text>
  <text x="200.0" y="239.20000000000002" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">AGS-101 Brighter LCD & Famicom Edition</text>
</svg>