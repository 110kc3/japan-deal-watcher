<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#271c08" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="260" rx="16" fill="url(#bg)" />
  <rect width="400" height="260" rx="16" fill="url(#glow)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Icon Graphics Group -->
  <g filter="url(#shadow)" transform="translate(200.0, 109.2)">
    
  <!-- Outer Barrel -->
  <circle cx="0" cy="-5" r="58" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
  <!-- Aperture & Focus Rings -->
  <circle cx="0" cy="-5" r="50" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <circle cx="0" cy="-5" r="42" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <!-- Front Optical Element Glass Glow -->
  <circle cx="0" cy="-5" r="32" fill="#0284c7" opacity="0.45" stroke="#38bdf8" stroke-width="2" />
  <!-- Glass Reflection Arc -->
  <path d="M -22 -22 A 30 30 0 0 1 20 -24" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  <circle cx="0" cy="-5" r="12" fill="#0f172a" stroke="#e2e8f0" stroke-width="1" />

  </g>
  
  <!-- Labels -->
  <text x="200.0" y="213.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">Japoński Obiektyw Manualny</text>
  <text x="200.0" y="239.20000000000002" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">SMC Pentax · Takumar · M42 · 0% Li-Ion</text>
