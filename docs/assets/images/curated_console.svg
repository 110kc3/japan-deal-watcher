<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1430" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="260" rx="16" fill="url(#bg)" />
  <rect width="400" height="260" rx="16" fill="url(#glow)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Icon Graphics Group -->
  <g filter="url(#shadow)" transform="translate(200.0, 109.2)">
    
  <!-- PSone + LCD or PS4 -->
  <rect x="-85" y="-15" width="170" height="50" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2.5" />
  <!-- Attached LCD Screen -->
  <rect x="-65" y="-68" width="130" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="-56" y="-61" width="112" height="42" rx="3" fill="#0284c7" opacity="0.4" stroke="#0ea5e9" stroke-width="1" />
  <!-- CD Lid Disc Circle -->
  <circle cx="0" cy="10" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <!-- Power & Open Buttons -->
  <circle cx="-55" cy="10" r="5" fill="#10b981" />
  <circle cx="55" cy="10" r="5" fill="#f59e0b" />

  </g>
  
  <!-- Labels -->
  <text x="200.0" y="213.2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">Konsola Stacjonarna Collector</text>
  <text x="200.0" y="239.20000000000002" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">PSone Combo LCD · PS4 Pro Rathalos · GameCube</text>
</svg>