<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <path d="M 50 0 L 50 300 M 100 0 L 100 300 M 150 0 L 150 300 M 200 0 L 200 300 M 250 0 L 250 300 M 300 0 L 300 300 M 350 0 L 350 300" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Glowing Shadow -->
  <ellipse cx="200" cy="245" rx="130" ry="25" fill="#f59e0b" opacity="0.15"/>

  <!-- Cardboard Box (Isometric 3D) -->
  <!-- Box Body Front -->
  <polygon points="100,165 240,210 240,260 100,215" fill="url(#boxFront)" stroke="#92400e" stroke-width="1.5"/>
  <!-- Box Body Right Side -->
  <polygon points="240,210 320,175 320,225 240,260" fill="url(#boxSide)" stroke="#78350f" stroke-width="1.5"/>
  
  <!-- Cardboard Flaps (Open) -->
  <!-- Left Flap Open -->
  <polygon points="100,165 60,140 120,135 150,150" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>
  <!-- Front Flap Hanging Down -->
  <polygon points="100,165 240,210 240,225 100,180" fill="#92400e" opacity="0.4"/>
  <!-- Right Flap Open -->
  <polygon points="240,210 320,175 355,190 280,225" fill="#78350f" stroke="#92400e" stroke-width="1.5"/>
  <!-- Back Flap -->
  <polygon points="180,130 260,115 320,175 240,180" fill="#d97706" opacity="0.6"/>

  <!-- Games overflowing from Box -->
  <!-- Game 1: DS Case (Black/White spine) -->
  <rect x="130" y="115" width="22" height="60" rx="3" transform="rotate(-15 130 115)" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="135" y="120" width="12" height="40" rx="1" transform="rotate(-15 130 115)" fill="#ffffff" opacity="0.9"/>

  <!-- Game 2: GBA Cartridge (Dark Gray / Gold label - Zelda/Pokemon style) -->
  <rect x="165" y="100" width="40" height="50" rx="4" transform="rotate(8 165 100)" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <rect x="170" y="112" width="30" height="28" rx="2" transform="rotate(8 165 100)" fill="url(#goldGrad)"/>

  <!-- Game 3: Pokemon Red/Gold Cartridge -->
  <rect x="215" y="95" width="42" height="55" rx="4" transform="rotate(22 215 95)" fill="#dc2626" stroke="#f87171" stroke-width="1.5"/>
  <rect x="222" y="110" width="28" height="30" rx="2" transform="rotate(22 215 95)" fill="url(#goldGrad)"/>

  <!-- Game 4: PSP UMD Case -->
  <rect x="260" y="125" width="20" height="58" rx="3" transform="rotate(35 260 125)" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="282" cy="155" r="7" fill="#0284c7"/>

  <!-- Japanese Shipping / Packaging Tape on Box -->
  <polygon points="170,187 185,192 185,242 170,237" fill="#fbbf24" opacity="0.85"/>
  
  <!-- "断捨離" (Danshari) Kanji Stamp on Box -->
  <rect x="115" y="180" width="45" height="24" rx="3" fill="#78350f" opacity="0.6"/>
  <text x="137" y="196" fill="#fef3c7" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="1">断捨離</text>

  <!-- Big Magnifying Glass Inspecting the Box -->
  <g transform="translate(140, 50)">
    <!-- Glass Lens -->
    <circle cx="90" cy="70" r="42" fill="url(#gemGrad)" opacity="0.25" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="90" cy="70" r="38" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <!-- Glass Reflection -->
    <path d="M 68 52 A 32 32 0 0 1 112 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Handle -->
    <line x1="120" y1="100" x2="160" y2="140" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="100" x2="160" y2="140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Gem Icon inside Glass -->
    <polygon points="90,58 102,68 90,84 78,68" fill="url(#gemGrad)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Sparkles / Hidden Gem Stars -->
  <path d="M 95 90 L 100 100 L 110 105 L 100 110 L 95 120 L 90 110 L 80 105 L 90 100 Z" fill="#38bdf8"/>
  <path d="M 315 80 L 319 88 L 327 92 L 319 96 L 315 104 L 311 96 L 303 92 L 311 88 Z" fill="#fbbf24"/>
  <path d="M 280 60 L 282 65 L 287 67 L 282 69 L 280 74 L 278 69 L 273 67 L 278 65 Z" fill="#a855f7"/>

  <!-- Badge at top: "DANSHARI / RÓŻNOŚCI AI INSPECTION" -->
  <rect x="25" y="18" width="350" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="45" cy="35" r="7" fill="#10b981"/>
  <text x="60" y="40" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">📦 DANSHARI &amp; MYSTERY LOTS · AI VISION</text>
  <rect x="300" y="24" width="65" height="22" rx="4" fill="#38bdf8"/>
  <text x="332" y="39" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" text-anchor="middle">VERIFIED</text>
</svg>
